es\" style=\"color:#5F5F72;font-size:13px\">Examples<\u002Fa><\u002Fdiv>\n<span style=\"width:1px;height:18px;background:#E4E1D9\"><\u002Fspan>\n<a href=\"demo.dc.html\" style=\"color:#0F0F16;padding:4px 0;border-bottom:2px solid transparent\">Product Demo<\u002Fa>\n<span style=\"width:1px;height:18px;background:#E4E1D9\"><\u002Fspan>\n<a href=\"roadmap.dc.html\" style=\"color:#0F0F16;padding:4px 0;border-bottom:2px solid transparent\">Phases &amp; Timelines<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<section style=\"background:linear-gradient(160deg,#F7EEF0 0%,#EEF0FB 45%,#FDFDFC 100%)\">\n<div style=\"max-width:1120px;margin:0 auto;padding:96px 24px 88px;display:flex;flex-direction:column;gap:24px\">\n<span style=\"align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5251FD;background:color-mix(in srgb,#5251FD 10%,#FDFDFC);padding:6px 12px;border-radius:999px\">Token Sharing<\u002Fspan>\n<h1 style=\"margin:0;font-family:'Articulat CF',sans-serif;font-weight:700;font-size:clamp(38px,5.8vw,64px);line-height:1.04;letter-spacing:-0.02em;color:#010165;max-width:880px;text-wrap:balance\">Verify a Customer Once. Share the Data With Your Partners.<\u002Fh1>\n\n<p style=\"margin: 0; font-size: 18px; line-height: 28px; color: #3E3E56; max-width: 680px; text-wrap: pretty; width: 881px; height: 124px\">Token Sharing enables two AiPrise customers who serve the same business or user to securely share verified data from an existing case. The receiving partner can choose to accept the shared verification as-is or re-run specific checks based on their own risk appetite and compliance requirements.<\u002Fp><div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n<a href=\"demo.dc.html\" style=\"background:#5251FD;color:#FDFDFC;font-weight:500;font-size:15px;padding:12px 20px;border-radius:999px;box-shadow:0 6px 18px color-mix(in srgb,#5251FD 30%,transparent)\">Watch the demos<\u002Fa>\n<a href=\"roadmap.dc.html\" style=\"background:#FDFDFC;color:#0F0F16;border:1px solid #D2CCC0;font-weight:500;font-size:15px;padding:12px 20px;border-radius:999px\">See phases &amp; timelines<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section>\n<div style=\"max-width:1120px;margin:0 auto;padding:88px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5251FD\">The use case<\u002Fdiv>\n<h2 style=\"margin:0;font-family:'Articulat CF',sans-serif;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.1;letter-spacing:-0.02em;color:#010165\">One Customer, Many Regulated Partners<\u002Fh2>\n<p style=\"margin:0;font-size:16px;line-height:26px;color:#3E3E56\">A merchant that signs up with a payments platform often also needs an account with that platform's banking, settlement or lending partner. Each partner has its own compliance obligations, so the merchant is asked for the same registration documents, ownership details and addresses several times.<\u002Fp>\n<p style=\"margin:0;font-size:16px;line-height:26px;color:#3E3E56\">With Token Sharing, the company that already verified the merchant shares those inputs under an agreed set of rules. The partner reruns them through its own AiPrise templates. Each company keeps its own policies, results and decisions.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"background:#F0EEEA;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#5F5F72\">Without Token Sharing<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:22px;color:#0F0F16\">\n<div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:#A10D0F;margin-top:7px\"><\u002Fspan>The merchant uploads the same documents to every partner.<\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:#A10D0F;margin-top:7px\"><\u002Fspan>Each partner collects and checks the data from scratch.<\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:#A10D0F;margin-top:7px\"><\u002Fspan>Onboarding with the second partner starts only after the first is done.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:color-mix(in srgb,#0F8A0F 7%,#FDFDFC);border:1px solid color-mix(in srgb,#0F8A0F 22%,#FDFDFC);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#0F8A0F\">With Token Sharing<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:22px;color:#0F0F16\">\n<div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:#0F8A0F;margin-top:7px\"><\u002Fspan>The merchant is verified once by the first partner.<\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:#0F8A0F;margin-top:7px\"><\u002Fspan>Approved cases that match the agreement are shared as tokens.<\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:#0F8A0F;margin-top:7px\"><\u002Fspan>The partner runs its own checks and asks only for what is missing.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#F0EEEA\">\n<div style=\"max-width:1120px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:12px;max-width:680px\">\n<div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5251FD\">Two roles<\u002Fdiv>\n<h2 style=\"margin:0;font-family:'Articulat CF',sans-serif;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.1;letter-spacing:-0.02em;color:#010165\">Donor and Recipient<\u002Fh2>\n<p style=\"margin:0;font-size:16px;line-height:26px;color:#3E3E56\">Every Token Sharing relationship has one Donor and one Recipient. A company can be a Donor to one partner and a Recipient of another.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FDFDFC;border-radius:16px;padding:28px 32px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;justify-content:center\">\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center\"><div style=\"width:72px;height:72px;border-radius:18px;background:#F0EEEA;display:flex;align-items:center;justify-content:center\"><span style=\"width:34px;height:34px;display:block;background:#0F0F16;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/store.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/store.svg) center/contain no-repeat\"><\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:15px;font-weight:700;color:#010165\">Merchant<\u002Fspan><span style=\"font-size:13px;color:#5F5F72\">Verified once<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:40px;height:2px;background:repeating-linear-gradient(90deg,#D2CCC0 0 8px,transparent 8px 14px);margin-top:36px\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center\"><div style=\"width:72px;height:72px;border-radius:18px;background:#FFF2E6;display:flex;align-items:center;justify-content:center\"><span style=\"width:34px;height:34px;display:block;background:#FF8F2E;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/badge-check.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/badge-check.svg) center/contain no-repeat\"><\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:15px;font-weight:700;color:#010165\">Donor<\u002Fspan><span style=\"font-size:13px;color:#5F5F72\">Verifies and shares inputs<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:40px;height:2px;background:repeating-linear-gradient(90deg,#FF8F2E 0 8px,transparent 8px 14px);margin-top:36px\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center\"><div style=\"height:72px;display:flex;align-items:center\"><span style=\"display:flex;align-items:center;gap:8px;background:#010165;color:#FDFDFC;border-radius:999px;padding:10px 16px;font:600 13px 'DM Sans',sans-serif\"><span style=\"width:16px;height:16px;display:block;background:#FDFDFC;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/key-round.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/key-round.svg) center/contain no-repeat\"><\u002Fspan>Token<\u002Fspan><\u002Fdiv><span style=\"font-size:13px;color:#5F5F72;max-width:120px\">Data package, under a live agreement<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1;min-width:40px;height:2px;background:repeating-linear-gradient(90deg,#5251FD 0 8px,transparent 8px 14px);margin-top:36px\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center\"><div style=\"width:72px;height:72px;border-radius:18px;background:#ECECFF;display:flex;align-items:center;justify-content:center\"><span style=\"width:34px;height:34px;display:block;background:#5251FD;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/inbox.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/inbox.svg) center/contain no-repeat\"><\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:15px;font-weight:700;color:#010165\">Recipient<\u002Fspan><span style=\"font-size:13px;color:#5F5F72\">Imports and runs own checks<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px\">\n<div style=\"background: #FDFDFC; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border-top: 4px solid #FF8F2E; position: relative\">\n\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;color:#9A4A00;background:#FFF2E6;padding:4px 10px;border-radius:999px\">DONOR<\u002Fspan><span style=\"font-size:15px;color:#3E3E56\">Shares customer data<\u002Fspan><\u002Fdiv>\n<div style=\"font-size:20px;font-weight:700;color:#010165\">The company that already verified the end merchant<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:23px;color:#3E3E56\">\n\n\n\n\n<\u002Fdiv>\n<span style=\"position: absolute; width: 36px; height: 36px; border-radius: 50%; background: #FF8F2E; border: 3px solid #FDFDFC; display: flex; align-items: center; justify-content: center; left: 491px; top: 17px\"><span style=\"width:18px;height:18px;display:block;background:#FDFDFC;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/badge-check.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/badge-check.svg) center/contain no-repeat\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n<div style=\"background: #FDFDFC; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border-top: 4px solid #5251FD; position: relative\">\n\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;color:#3A39C9;background:#ECECFF;padding:4px 10px;border-radius:999px\">RECIPIENT<\u002Fspan><span style=\"font-size:15px;color:#3E3E56\">Receives customer data<\u002Fspan><\u002Fdiv>\n<div style=\"font-size:20px;font-weight:700;color:#010165\">The partner onboarding the same end merchant<\u002Fdiv>\n\n<span style=\"position: absolute; width: 36px; height: 36px; border-radius: 50%; background: #5251FD; border: 3px solid #FDFDFC; display: flex; align-items: center; justify-content: center; left: 488px; top: 20px\"><span style=\"width:18px;height:18px;display:block;background:#FDFDFC;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/inbox.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/inbox.svg) center/contain no-repeat\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"terms\" style=\"scroll-margin-top:64px\">\n<div style=\"max-width:1120px;margin:0 auto;padding:88px 24px 0;display:flex;flex-direction:column;gap:32px\">\n<div style=\"display:flex;flex-direction:column;gap:12px;max-width:680px\">\n<div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5251FD\">Key terms<\u002Fdiv>\n<h2 style=\"margin:0;font-family:'Articulat CF',sans-serif;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.1;letter-spacing:-0.02em;color:#010165\">The Words You Will See<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;border-top:1px solid #D2CCC0\">\n<div style=\"display:grid;grid-template-columns:40px minmax(120px,200px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #E4E1D9\">\n<span style=\"width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,#5251FD 10%,#FDFDFC);display:flex;align-items:center;justify-content:center\"><span style=\"width:22px;height:22px;display:block;background:#5251FD;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/handshake.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/handshake.svg) center/contain no-repeat\"><\u002Fspan><\u002Fspan>\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Connection<br><\u002Fdiv>\n<p style=\"margin:0;font-size:14px;line-height:22px;color:#3E3E56\">A connection between a Donor and a Recipient. It allows agreements to be proposed. It does not share any data.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:40px minmax(120px,200px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #E4E1D9\">\n<span style=\"width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,#5251FD 10%,#FDFDFC);display:flex;align-items:center;justify-content:center\"><span style=\"width:22px;height:22px;display:block;background:#5251FD;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/file-text.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/file-text.svg) center/contain no-repeat\"><\u002Fspan><\u002Fspan>\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Agreement<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;line-height:22px;color:#3E3E56\">The rules for sharing under a contract: which cases qualify, from when to when, and what may be requested later. The Donor approves it before anything is shared.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:40px minmax(120px,200px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #E4E1D9\">\n<span style=\"width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,#5251FD 10%,#FDFDFC);display:flex;align-items:center;justify-content:center\"><span style=\"width:22px;height:22px;display:block;background:#5251FD;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/key-round.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/key-round.svg) center/contain no-repeat\"><\u002Fspan><\u002Fspan>\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Token<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;line-height:22px;color:#3E3E56\">A package of one approved case's input data, sent from Donor to Recipient under a live agreement.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:40px minmax(120px,200px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #E4E1D9\">\n<span style=\"width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,#5251FD 10%,#FDFDFC);display:flex;align-items:center;justify-content:center\"><span style=\"width:22px;height:22px;display:block;background:#5251FD;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/upload.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/upload.svg) center/contain no-repeat\"><\u002Fspan><\u002Fspan>\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Export<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;line-height:22px;color:#3E3E56\">The Donor side of a token. Approved cases that match the agreement are queued and sent automatically.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:40px minmax(120px,200px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #E4E1D9\">\n<span style=\"width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,#5251FD 10%,#FDFDFC);display:flex;align-items:center;justify-content:center\"><span style=\"width:22px;height:22px;display:block;background:#5251FD;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/download.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/download.svg) center/contain no-repeat\"><\u002Fspan><\u002Fspan>\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Import<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;line-height:22px;color:#3E3E56\">The Recipient side of a token. It is pulled in automatically or by hand, creating a new profile.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:40px minmax(120px,200px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #E4E1D9\">\n<span style=\"width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,#5251FD 10%,#FDFDFC);display:flex;align-items:center;justify-content:center\"><span style=\"width:22px;height:22px;display:block;background:#5251FD;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/message-square.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/message-square.svg) center/contain no-repeat\"><\u002Fspan><\u002Fspan>\n<div style=\"font-size:16px;font-weight:700;color:#010165\">RFI<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;line-height:22px;color:#3E3E56\">A request for information. The Recipient asks for a question or document that is in the agreement's catalog.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" style=\"scroll-margin-top:64px\">\n<div style=\"max-width:1120px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:56px\">\n<div style=\"display:flex;flex-direction:column;gap:12px;max-width:680px\">\n<div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5251FD\">How it works<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Articulat CF',sans-serif; font-weight: 700; font-size: clamp(28px,3.6vw,40px); line-height: 1.1; letter-spacing: -0.02em; color: #010165; width: 703px; height: 49px\">How Donor and Recipient Work Together<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px;width:100%;max-width:920px;margin:0 auto\">\n<div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:20px;font-weight:700;color:#010165\">1. Setting up and sharing<\u002Fdiv><div style=\"font-size:15px;color:#3E3E56\">Who does what, from the first invite to the final decision.<\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative;padding:0 16px 20px\">\n<div style=\"position:absolute;top:0;bottom:0;left:0;width:calc(50% - 28px);background:#FFFAF5;border:1px solid #FFE1C7;border-radius:16px\"><\u002Fdiv>\n<div style=\"position:absolute;top:0;bottom:0;right:0;width:calc(50% - 28px);background:#F7F7FF;border:1px solid #D2D2FD;border-radius:16px\"><\u002Fdiv>\n<div style=\"position:relative;display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0 12px;padding:18px 0 6px\">\n<div style=\"display:flex;align-items:center;gap:8px;justify-content:center\"><span style=\"width:18px;height:18px;display:block;flex:none;background:#FF8F2E;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/building-2.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/building-2.svg) center/contain no-repeat\"><\u002Fspan><span style=\"font:600 13px 'DM Sans',sans-serif;letter-spacing:.08em;color:#9A4A00\">DONOR<\u002Fspan><\u002Fdiv><div><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;justify-content:center\"><span style=\"width:18px;height:18px;display:block;flex:none;background:#5251FD;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/building-2.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/building-2.svg) center/contain no-repeat\"><\u002Fspan><span style=\"font:600 13px 'DM Sans',sans-serif;letter-spacing:.08em;color:#3A39C9\">RECIPIENT<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:relative;display:flex;flex-direction:column\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0 12px;align-items:stretch\">\n<div style=\"padding:0 0 16px\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;height:100%\">\n<span style=\"width:34px;height:34px;border-radius:50%;background:#5251FD;color:#FDFDFC;display:flex;align-items:center;justify-content:center;font:600 14px 'DM Sans',sans-serif;flex:none;box-shadow:0 0 0 5px #FDFDFC;margin-top:14px\">1<\u002Fspan>\n<span style=\"flex:1;width:2px;background:#D2CCC0;min-height:20px\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:0 0 16px\"><div style=\"background:#FDFDFC;border:1px solid #D2D2FD;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,15,22,.05);display:flex;flex-direction:column;gap:4px\">\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Invite a partner<\u002Fdiv>\n<div style=\"font-size:14px;line-height:21px;color:#3E3E56\">Invite the company that already verified the customer.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0 12px;align-items:stretch\">\n<div style=\"padding:0 0 16px\"><div style=\"background:#FDFDFC;border:1px solid #FFE1C7;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,15,22,.05);display:flex;flex-direction:column;gap:4px\">\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Accept the invite<\u002Fdiv>\n<div style=\"font-size:14px;line-height:21px;color:#3E3E56\">Nothing is shared yet.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;height:100%\">\n<span style=\"width:34px;height:34px;border-radius:50%;background:#FF8F2E;color:#FDFDFC;display:flex;align-items:center;justify-content:center;font:600 14px 'DM Sans',sans-serif;flex:none;box-shadow:0 0 0 5px #FDFDFC;margin-top:14px\">2<\u002Fspan>\n<span style=\"flex:1;width:2px;background:#D2CCC0;min-height:20px\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:0 0 16px\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0 12px;align-items:stretch\">\n<div style=\"padding:0 0 16px\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;height:100%\">\n<span style=\"width:34px;height:34px;border-radius:50%;background:#5251FD;color:#FDFDFC;display:flex;align-items:center;justify-content:center;font:600 14px 'DM Sans',sans-serif;flex:none;box-shadow:0 0 0 5px #FDFDFC;margin-top:14px\">3<\u002Fspan>\n<span style=\"flex:1;width:2px;background:#D2CCC0;min-height:20px\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:0 0 16px\"><div style=\"background:#FDFDFC;border:1px solid #D2D2FD;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,15,22,.05);display:flex;flex-direction:column;gap:4px\">\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Set the sharing rules<\u002Fdiv>\n<div style=\"font-size:14px;line-height:21px;color:#3E3E56\">Which customers, for how long, and what can be asked for later.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0 12px;align-items:stretch\">\n<div style=\"padding:0 0 16px\"><div style=\"background:#FDFDFC;border:1px solid #FFE1C7;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,15,22,.05);display:flex;flex-direction:column;gap:4px\">\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Review the rules<\u002Fdiv>\n<div style=\"font-size:14px;line-height:21px;color:#3E3E56\">Agree to start sharing.<\u002Fdiv><div style=\"margin-top:8px;display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:#A10D0F;background:color-mix(in srgb,#A10D0F 6%,#FDFDFC);border-radius:8px;padding:6px 10px\"><span style=\"width: 14px; height: 14px; display: block; flex: 0 0 auto; background: rgb(161, 13, 15); mask: url(&quot;https://unpkg.com/lucide-static@0.469.0/icons/corner-up-left.svg&quot;) center center / contain no-repeat;\"><\u002Fspan>Not agreed? Sent back to (step 3) Recipient with reason<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;height:100%\">\n<span style=\"width:34px;height:34px;border-radius:50%;background:#FF8F2E;color:#FDFDFC;display:flex;align-items:center;justify-content:center;font:600 14px 'DM Sans',sans-serif;flex:none;box-shadow:0 0 0 5px #FDFDFC;margin-top:14px\">4<\u002Fspan>\n<span style=\"flex:1;width:2px;background:#D2CCC0;min-height:20px\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:0 0 16px\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0 12px;align-items:stretch\">\n<div style=\"padding:0 0 16px\"><div style=\"background:#FDFDFC;border:1px solid #FFE1C7;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,15,22,.05);display:flex;flex-direction:column;gap:4px\">\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Approve a customer<\u002Fdiv>\n<div style=\"font-size:14px;line-height:21px;color:#3E3E56\">Customers who match the rules are shared.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;height:100%\">\n<span style=\"width:34px;height:34px;border-radius:50%;background:#FF8F2E;color:#FDFDFC;display:flex;align-items:center;justify-content:center;font:600 14px 'DM Sans',sans-serif;flex:none;box-shadow:0 0 0 5px #FDFDFC;margin-top:14px\">5<\u002Fspan>\n<span style=\"flex:1;width:2px;background:#D2CCC0;min-height:20px\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:0 0 16px\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0 12px;align-items:stretch\">\n<div style=\"padding:0 0 16px\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;height:100%\">\n<span style=\"width:34px;height:34px;border-radius:50%;background:#5251FD;color:#FDFDFC;display:flex;align-items:center;justify-content:center;font:600 14px 'DM Sans',sans-serif;flex:none;box-shadow:0 0 0 5px #FDFDFC;margin-top:14px\">6<\u002Fspan>\n<span style=\"flex:1;width:2px;background:#D2CCC0;min-height:20px\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:0 0 16px\"><div style=\"background:#FDFDFC;border:1px solid #D2D2FD;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,15,22,.05);display:flex;flex-direction:column;gap:4px\">\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Receive the customer's data<\u002Fdiv>\n<div style=\"font-size:14px;line-height:21px;color:#3E3E56\">It arrives as a new customer record.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0 12px;align-items:stretch\">\n<div style=\"padding:0 0 0px\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;height:100%\">\n<span style=\"width:34px;height:34px;border-radius:50%;background:#0F8A0F;color:#FDFDFC;display:flex;align-items:center;justify-content:center;font:600 14px 'DM Sans',sans-serif;flex:none;box-shadow:0 0 0 5px #FDFDFC;margin-top:14px\">7<\u002Fspan>\n\n<\u002Fdiv>\n<div style=\"padding:0 0 0px\"><div style=\"background:#FDFDFC;border:1px solid #D2D2FD;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,15,22,.05);display:flex;flex-direction:column;gap:4px\">\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Run your own checks<\u002Fdiv>\n<div style=\"font-size:14px;line-height:21px;color:#3E3E56\">Make your own decision.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px;width:100%;max-width:920px;margin:0 auto\">\n<div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:20px;font-weight:700;color:#010165\">2. Asking for more information<\u002Fdiv><div style=\"font-size:15px;color:#3E3E56\">When the Recipient needs something the shared data does not cover.<\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative;padding:0 16px 20px\">\n<div style=\"position:absolute;top:0;bottom:0;left:0;width:calc(50% - 28px);background:#FFFAF5;border:1px solid #FFE1C7;border-radius:16px\"><\u002Fdiv>\n<div style=\"position:absolute;top:0;bottom:0;right:0;width:calc(50% - 28px);background:#F7F7FF;border:1px solid #D2D2FD;border-radius:16px\"><\u002Fdiv>\n<div style=\"position:relative;display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0 12px;padding:18px 0 6px\">\n<div style=\"display:flex;align-items:center;gap:8px;justify-content:center\"><span style=\"width:18px;height:18px;display:block;flex:none;background:#FF8F2E;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/building-2.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/building-2.svg) center/contain no-repeat\"><\u002Fspan><span style=\"font:600 13px 'DM Sans',sans-serif;letter-spacing:.08em;color:#9A4A00\">DONOR<\u002Fspan><\u002Fdiv><div><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;justify-content:center\"><span style=\"width:18px;height:18px;display:block;flex:none;background:#5251FD;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/building-2.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/building-2.svg) center/contain no-repeat\"><\u002Fspan><span style=\"font:600 13px 'DM Sans',sans-serif;letter-spacing:.08em;color:#3A39C9\">RECIPIENT<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:relative;display:flex;flex-direction:column\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0 12px;align-items:stretch\">\n<div style=\"padding:0 0 16px\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;height:100%\">\n<span style=\"width:34px;height:34px;border-radius:50%;background:#5251FD;color:#FDFDFC;display:flex;align-items:center;justify-content:center;font:600 14px 'DM Sans',sans-serif;flex:none;box-shadow:0 0 0 5px #FDFDFC;margin-top:14px\">1<\u002Fspan>\n<span style=\"flex:1;width:2px;background:#D2CCC0;min-height:20px\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:0 0 16px\"><div style=\"background:#FDFDFC;border:1px solid #D2D2FD;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,15,22,.05);display:flex;flex-direction:column;gap:4px\">\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Ask for more<\u002Fdiv>\n<div style=\"font-size:14px;line-height:21px;color:#3E3E56\">A document or question from the agreed RFI catalog, from the agreement.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0 12px;align-items:stretch\">\n<div style=\"padding:0 0 16px\"><div style=\"background:#FDFDFC;border:1px solid #FFE1C7;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,15,22,.05);display:flex;flex-direction:column;gap:4px\">\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Check what is on profile<\u002Fdiv>\n<div style=\"margin-top:10px;display:flex;flex-direction:column;gap:6px\">\n<div style=\"display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:19px;color:#0F0F16;background:color-mix(in srgb,#0F8A0F 7%,#FDFDFC);border-radius:8px;padding:7px 10px\"><span style=\"width:15px;height:15px;display:block;flex:none;background:#0F8A0F;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/check.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/check.svg) center/contain no-repeat\"><\u002Fspan><span><b style=\"color:#0F8A0F\">Data available on Donor profile:<\u002Fb> answered right away.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:19px;color:#0F0F16;background:color-mix(in srgb,#FF8F2E 9%,#FDFDFC);border-radius:8px;padding:7px 10px\"><span style=\"width:15px;height:15px;display:block;flex:none;background:#9A4A00;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/mail.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/mail.svg) center/contain no-repeat\"><\u002Fspan><span><b style=\"color:#9A4A00\">Data not with Donor already:<\u002Fb> the customer is asked.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;height:100%\">\n<span style=\"width:34px;height:34px;border-radius:50%;background:#FF8F2E;color:#FDFDFC;display:flex;align-items:center;justify-content:center;font:600 14px 'DM Sans',sans-serif;flex:none;box-shadow:0 0 0 5px #FDFDFC;margin-top:14px\">2<\u002Fspan>\n<span style=\"flex:1;width:2px;background:#D2CCC0;min-height:20px\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:0 0 16px\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0 12px;align-items:stretch\">\n<div style=\"padding:0 0 0px\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;height:100%\">\n<span style=\"width:34px;height:34px;border-radius:50%;background:#0F8A0F;color:#FDFDFC;display:flex;align-items:center;justify-content:center;font:600 14px 'DM Sans',sans-serif;flex:none;box-shadow:0 0 0 5px #FDFDFC;margin-top:14px\">3<\u002Fspan>\n\n<\u002Fdiv>\n<div style=\"padding:0 0 0px\"><div style=\"background:#FDFDFC;border:1px solid #D2D2FD;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,15,22,.05);display:flex;flex-direction:column;gap:4px\">\n<div style=\"font-size:16px;font-weight:700;color:#010165\">Receive the answer<\u002Fdiv>\n<div style=\"font-size:14px;line-height:21px;color:#3E3E56\">Saved for next time.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"examples\" style=\"background:#F0EEEA;scroll-margin-top:64px\">\n<div style=\"max-width:1120px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:12px;max-width:680px\">\n<div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5251FD\">Example scenarios<\u002Fdiv>\n<h2 style=\"margin:0;font-family:'Articulat CF',sans-serif;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.1;letter-spacing:-0.02em;color:#010165\">Where Token Sharing Fits<\u002Fh2>\n<p style=\"margin:0;font-size:16px;line-height:26px;color:#3E3E56\">Illustrative setups based on common partner models. Company types are examples.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px\">\n\n<div style=\"background:#FDFDFC;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#5251FD\">01 / Payments and settlement<\u002Fdiv>\n<div style=\"font-size:19px;font-weight:700;line-height:1.25;color:#010165\">A payments platform shares merchant KYB with its settlement partner<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:21px\">\n<div style=\"display:grid;grid-template-columns:84px 1fr;gap:8px\"><span style=\"color:#5F5F72\">Donor<\u002Fspan><span>Cross-border payments platform<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:84px 1fr;gap:8px\"><span style=\"color:#5F5F72\">Recipient<\u002Fspan><span>Settlement partner<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:84px 1fr;gap:8px\"><span style=\"color:#5F5F72\">Agreement<\u002Fspan><span>Business Profiles · Indonesia · not crypto · max 6 months old · automatic import<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:15px;line-height:24px;color:#3E3E56;border-top:1px solid #E4E1D9;padding-top:14px\">Approved merchants arrive at the partner as tokens and run through its own KYB template. A bank statement request is answered from the platform's data on file.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background:#FDFDFC;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#5251FD\">02 / Marketplace lending<\u002Fdiv>\n<div style=\"font-size:19px;font-weight:700;line-height:1.25;color:#010165\">A marketplace shares seller KYB with a working-capital lender<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:21px\">\n<div style=\"display:grid;grid-template-columns:84px 1fr;gap:8px\"><span style=\"color:#5F5F72\">Donor<\u002Fspan><span>B2B marketplace<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:84px 1fr;gap:8px\"><span style=\"color:#5F5F72\">Recipient<\u002Fspan><span>Lending partner<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:84px 1fr;gap:8px\"><span style=\"color:#5F5F72\">Agreement<\u002Fspan><span>Business Profiles · sellers who opt in · manual import<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:15px;line-height:24px;color:#3E3E56;border-top:1px solid #E4E1D9;padding-top:14px\">The lender reviews each token before importing. Its source-of-funds question goes to the seller under the marketplace's name.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background:#FDFDFC;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#5251FD\">03 / Wallet and card issuing<\u002Fdiv>\n<div style=\"font-size:19px;font-weight:700;line-height:1.25;color:#010165\">A wallet app shares user KYC with its card-issuing partner<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:21px\">\n<div style=\"display:grid;grid-template-columns:84px 1fr;gap:8px\"><span style=\"color:#5F5F72\">Donor<\u002Fspan><span>Consumer wallet<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:84px 1fr;gap:8px\"><span style=\"color:#5F5F72\">Recipient<\u002Fspan><span>Card issuer<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:84px 1fr;gap:8px\"><span style=\"color:#5F5F72\">Agreement<\u002Fspan><span>User Profiles · approved users · automatic import<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:15px;line-height:24px;color:#3E3E56;border-top:1px solid #E4E1D9;padding-top:14px\">Users who request a card do not repeat identity steps. The issuer runs its own KYC template on the shared inputs.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section>\n<div style=\"max-width:880px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:32px\">\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5251FD\">FAQ<\u002Fdiv>\n<h2 style=\"margin:0;font-family:'Articulat CF',sans-serif;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.1;letter-spacing:-0.02em;color:#010165\">Common Questions<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;border-top:1px solid #D2CCC0\">\n<sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"6\">\n<div style=\"border-bottom:1px solid #E4E1D9\">\n<div sc-camel-on-click=\"{{ f.toggle }}\" style=\"display:flex;align-items:center;gap:16px;padding:20px 0;cursor:pointer\"><span style=\"flex:1;font-size:17px;font-weight:700;color:#010165\">{{ f.q }}<\u002Fspan><span style=\"font:400 22px 'DM Sans',sans-serif;color:#5251FD;width:20px;text-align:center\">{{ f.icon }}<\u002Fspan><\u002Fdiv>\n<sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:0 36px 20px 0;font-size:15px;line-height:24px;color:#3E3E56\">{{ f.a }}<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#010165\">\n<div style=\"max-width:1120px;margin:0 auto;padding:64px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap\">\n<div style=\"flex:1;min-width:260px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"font-family:'Articulat CF',sans-serif;font-weight:700;font-size:28px;line-height:1.15;letter-spacing:-0.02em;color:#FDFDFC\">See it in the product<\u002Fdiv>\n<p style=\"margin:0;font-size:16px;line-height:26px;color:#FDFDFC\">Short videos of every step, from invite to terminate.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n<a href=\"demo.dc.html\" style=\"background:#5251FD;color:#FDFDFC;font-weight:500;font-size:15px;padding:12px 20px;border-radius:999px\">Watch the demos<\u002Fa>\n<a href=\"mailto:support@aiprise.com\" style=\"background:transparent;color:#FDFDFC;border:1px solid #FDFDFC;font-weight:500;font-size:15px;padding:12px 20px;border-radius:999px\">Contact your account team<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst FAQ = [\n  ['Does accepting a contract share any data?', 'No. A contract only allows the Recipient to propose agreements. Data moves only after the Donor approves an agreement and it goes live.'],\n  ['Who makes the compliance decision?', \"Each company makes its own. The Recipient runs the shared inputs through its own templates and decides. The Donor's results and verdict are not shared in Phase 1.\"],\n  ['Can the Donor see what the Recipient did with the data?', \"The Donor sees whether each token is ready or imported. The Recipient's profile, results and decision stay with the Recipient.\"],\n  ['What happens when an agreement is paused?', 'No new cases are shared. Tokens already shared and open requests keep working. Resuming needs both sides to agree.'],\n  ['What happens when an agreement is terminated?', 'Sharing stops for good and requests on tokens already shared are revoked. Termination cannot be undone.'],\n  ['Who does the merchant hear from when more information is needed?', \"If the Donor doesn't have the answer on file, the merchant is asked under the Donor's name. The answer is saved and reused within the reuse window.\"]\n];\nclass Component extends DCLogic {\n  state = { open: 0 };\n  renderVals() {\n    return {\n      faqs: FAQ.map(([q, a], i) => ({ q, a, open: this.state.open === i, icon: this.state.open === i ? '−' : '+', toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i })) }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
