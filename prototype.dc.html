    const root = document.getElementById('ts-root');
    if (!root) return;
    const q = new URLSearchParams((location.search || '').replace(/^\?/, '') + '&' + (location.hash || '').replace(/^#/, ''));

    const SIDE = { d: { name: 'Donor', who: 'Kast · shares customer data', col: '#FF8F2E' }, r: { name: 'Recipient', who: 'Reap · receives customer data', col: '#5251FD' } };

    root.innerHTML =

    function geom(act) {
